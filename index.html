<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10100c"><meta name="description" content="A cozy Christmas fireplace screensaver with a 25-second video recorder.">
<title>Christmas Hearth — Fireplace Screensaver</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090b08;font-family:Georgia,'Times New Roman',serif}canvas{display:block;width:100vw;height:100vh}
#controls{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid #e7d7b044;border-radius:14px;background:#101710dc;backdrop-filter:blur(16px);color:#f4ead5;box-shadow:0 12px 45px #0009;opacity:0;transition:opacity .3s;white-space:nowrap;font-family:Arial,sans-serif}
body:hover #controls,body.controls-visible #controls{opacity:1}button{border:1px solid #e8ddc533;border-radius:9px;background:#ffffff0c;color:#fff5e8;padding:10px 14px;font-size:12px;font-weight:650;cursor:pointer}button:hover{background:#315a3b;border-color:#b8c99b}button:disabled{opacity:.5;cursor:wait}#download{background:#8b252b;border-color:#c66c62}#status{font-size:11px;color:#e6d4a7;min-width:150px}
#hint{position:fixed;top:18px;right:22px;color:#f6e9d0b8;font:11px Arial,sans-serif;letter-spacing:.08em;text-shadow:0 2px 8px #000;opacity:0;transition:opacity .3s}body:hover #hint{opacity:1}
@media(max-width:700px){#controls{bottom:9px;gap:5px;padding:8px;max-width:96vw;flex-wrap:wrap;justify-content:center}button{padding:8px 10px;font-size:11px}#status{min-width:100%;text-align:center}}
</style>
</head>
<body>
<canvas id="scene" aria-label="Cozy Christmas living room with a glowing fireplace, decorated tree, garland and stockings"></canvas>
<div id="hint">D · SAVE 25-SECOND CLIP &nbsp; | &nbsp; F · FULLSCREEN &nbsp; | &nbsp; H · CONTROLS</div>
<div id="controls"><button id="download">Download 25s Christmas clip (D)</button><button id="fullscreen">Fullscreen (F)</button><button id="audio">Enable fireplace audio</button><span id="status">A quiet Christmas evening</span></div>
<script>
(()=>{"use strict";
const canvas=document.getElementById("scene"),ctx=canvas.getContext("2d",{alpha:false}),W=1920,H=1080;
canvas.width=W;canvas.height=H;
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let time=0,sparks=[],snow=[],audioContext=null,audioDestination=null,recording=false;
for(let i=0;i<85;i++)snow.push({x:rand(0,W),y:rand(0,H),r:rand(1,3),speed:rand(.18,.65),drift:rand(-.25,.25)});
function rr(x,y,w,h,r,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function line(x1,y1,x2,y2,color,width){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function room(){
 const wall=ctx.createLinearGradient(0,0,0,H);wall.addColorStop(0,"#26332a");wall.addColorStop(.58,"#263026");wall.addColorStop(1,"#171d17");ctx.fillStyle=wall;ctx.fillRect(0,0,W,H);
 // warm wood floor
 const floor=ctx.createLinearGradient(0,790,0,H);floor.addColorStop(0,"#493021");floor.addColorStop(1,"#1d130e");ctx.fillStyle=floor;ctx.fillRect(0,790,W,290);
 for(let y=835;y<1080;y+=82){line(0,y,W,y,"rgba(8,5,3,.36)",4);for(let x=(y%2)*120;x<W;x+=440)line(x,y,x+170,y+82,"rgba(220,165,104,.07)",2)}
 // snowy night window
 rr(95,125,470,450,9,"#493a2b");rr(112,142,436,416,3,"#111d28");
 const night=ctx.createLinearGradient(0,145,0,550);night.addColorStop(0,"#14243a");night.addColorStop(1,"#41505a");rr(119,149,422,402,2,night);
 for(let i=0;i<35;i++){const x=125+(i*79)%400,y=165+(i*137)%350;ctx.fillStyle="rgba(255,255,235,.65)";ctx.beginPath();ctx.arc(x,y,1.5,0,Math.PI*2);ctx.fill()}
 // window muntins
 rr(321,145,12,410,3,"#57412e");rr(115,344,430,12,3,"#57412e");
 // curtains
 ctx.fillStyle="#7b2630";ctx.beginPath();ctx.moveTo(75,105);ctx.bezierCurveTo(150,240,95,420,150,600);ctx.lineTo(105,610);ctx.bezierCurveTo(40,420,95,220,75,105);ctx.fill();
 ctx.beginPath();ctx.moveTo(580,105);ctx.bezierCurveTo(505,240,560,420,505,600);ctx.lineTo(550,610);ctx.bezierCurveTo(615,420,560,220,580,105);ctx.fill();
 // central chimney breast
 rr(625,70,790,890,12,"#1d241e");const stone=ctx.createLinearGradient(0,80,0,960);stone.addColorStop(0,"#596052");stone.addColorStop(.5,"#394237");stone.addColorStop(1,"#252b24");rr(655,95,730,840,8,stone);
 for(let y=120;y<900;y+=76){const off=(Math.floor(y/76)%2)*58;for(let x=675+off;x<1360;x+=116){ctx.strokeStyle="rgba(10,13,9,.35)";ctx.lineWidth=3;ctx.strokeRect(x,y,108,69);ctx.strokeStyle="rgba(222,210,177,.08)";ctx.lineWidth=1;ctx.strokeRect(x+3,y+3,102,63)}}
 // fireplace surround and firebox
 rr(760,330,520,570,10,"#17130f");rr(785,350,470,535,5,"#080907");
 const inner=ctx.createLinearGradient(0,370,0,880);inner.addColorStop(0,"#070a08");inner.addColorStop(.7,"#21140c");inner.addColorStop(1,"#090806");rr(800,365,440,510,3,inner);
 rr(735,300,570,45,7,"#806448");rr(710,285,620,24,5,"#b08a5c");
 // mantel decorations
 rr(690,250,660,36,5,"#65462f");rr(680,239,680,15,5,"#a98258");
 // garland
 ctx.lineCap="round";ctx.strokeStyle="#173d2a";ctx.lineWidth=28;ctx.beginPath();ctx.moveTo(705,244);ctx.bezierCurveTo(830,340,1170,340,1335,244);ctx.stroke();
 for(let i=0;i<34;i++){const x=710+i*18.5,y=248+Math.sin(i/33*Math.PI)*85;ctx.save();ctx.translate(x,y);ctx.rotate((i%2?-.65:.65));ctx.fillStyle=i%3?"#285c39":"#477148";ctx.beginPath();ctx.ellipse(0,0,19,7,0,0,Math.PI*2);ctx.fill();ctx.restore()}
 // garland bulbs
 for(let i=0;i<15;i++){const x=720+i*43,y=250+Math.sin(i/14*Math.PI)*81;const colors=["#e9bd68","#a52e35","#d9d5a1"];ctx.shadowColor=colors[i%3];ctx.shadowBlur=18;ctx.fillStyle=colors[i%3];ctx.beginPath();ctx.arc(x,y+12,5,0,Math.PI*2);ctx.fill()}ctx.shadowBlur=0;
 // stockings
 for(const x of [820,960,1100]){ctx.fillStyle="#9b2932";ctx.beginPath();ctx.moveTo(x,290);ctx.lineTo(x+72,290);ctx.lineTo(x+68,385);ctx.quadraticCurveTo(x+68,425,x+35,414);ctx.quadraticCurveTo(x+10,407,x+23,380);ctx.lineTo(x+28,290);ctx.fill();rr(x-2,282,78,19,4,"#e5d5b5");ctx.fillStyle="#e5d5b5";ctx.beginPath();ctx.arc(x+36,292,3,0,Math.PI*2);ctx.fill()}
 // small candles on mantel ends
 for(const x of [735,1260]){rr(x,185,28,58,5,"#e4d5b4");ctx.shadowColor="#ffc46d";ctx.shadowBlur=24;ctx.fillStyle="#ffd28a";ctx.beginPath();ctx.ellipse(x+14,176,7,15,0,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}
 // rug
 ctx.fillStyle="#702a2d";ctx.beginPath();ctx.ellipse(1010,1000,590,90,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#c6a16c";ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(1010,1000,550,68,0,0,Math.PI*2);ctx.stroke();
}
function tree(){
 // tree on right side
 const x=1580,base=895;
 // soft light aura
 const aura=ctx.createRadialGradient(x,550,20,x,570,440);aura.addColorStop(0,"rgba(255,202,112,.16)");aura.addColorStop(1,"rgba(255,202,112,0)");ctx.fillStyle=aura;ctx.fillRect(1120,120,800,850);
 // trunk
 rr(x-32,base-15,64,110,8,"#55321e");
 for(let i=0;i<5;i++){const y=300+i*122,w=170+i*43;ctx.fillStyle=["#153e2c","#174832","#123925"][i%3];ctx.beginPath();ctx.moveTo(x,y-135);ctx.quadraticCurveTo(x-w*.62,y-42,x-w,y+55);ctx.quadraticCurveTo(x,y+100,x+w,y+55);ctx.quadraticCurveTo(x+w*.62,y-42,x,y-135);ctx.fill();ctx.strokeStyle="rgba(8,25,15,.5)";ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x,y-120);ctx.lineTo(x,y+52);ctx.stroke()}
 // light strings spiral
 ctx.strokeStyle="#b9a06a";ctx.lineWidth=3;ctx.beginPath();for(let i=0;i<=180;i++){const f=i/180,y=280+f*560,w=120+f*215,a=f*Math.PI*9;const px=x+Math.cos(a)*w,py=y+Math.sin(a)*12;if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py)}ctx.stroke();
 for(let i=0;i<54;i++){const f=i/54,y=300+f*520,w=125+f*200,a=f*Math.PI*9;const px=x+Math.cos(a)*w,py=y+Math.sin(a)*12;const c=i%4===0?"#e7c77c":i%4===1?"#d6dfb0":i%4===2?"#c64c43":"#f4e2b6";ctx.shadowColor=c;ctx.shadowBlur=14;ctx.fillStyle=c;ctx.beginPath();ctx.arc(px,py,4.5,0,Math.PI*2);ctx.fill()}ctx.shadowBlur=0;
 // ornaments
 const ornaments=["#b52e37","#d6b46a","#e8dfc4","#9b2630"];for(let i=0;i<24;i++){const f=.18+(i%6)*.13,y=315+f*520,w=110+f*190,a=i*2.399;const px=x+Math.cos(a)*w*.8,py=y+Math.sin(a)*75;ctx.fillStyle=ornaments[i%4];ctx.shadowColor=ornaments[i%4];ctx.shadowBlur=8;ctx.beginPath();ctx.arc(px,py,11,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle="#e8d7a7";ctx.fillRect(px-2,py-14,4,5)}
 // star topper
 ctx.save();ctx.translate(x,270);ctx.shadowColor="#ffe3a0";ctx.shadowBlur=35;ctx.fillStyle="#f2d48b";ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?18:43;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.restore();
 // gifts
 const gifts=[[-155,910,115,85,"#9c2831"],[-25,930,130,68,"#d4b56f"],[100,915,120,82,"#214b35"],[10,865,90,65,"#9b3037"]];for(const [dx,y,w,h,c] of gifts){rr(x+dx,y,w,h,5,c);rr(x+dx+w*.44,y, w*.12,h,2,"#e7d4a4");rr(x+dx,y+h*.43,w,h*.12,2,"#e7d4a4");}
}
function logs(){const pieces=[{x:845,y:815,w:350,a:-.06},{x:875,y:845,w:310,a:.08},{x:920,y:790,w:230,a:-.12}];for(const p of pieces){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);const g=ctx.createLinearGradient(0,-26,0,26);g.addColorStop(0,"#815332");g.addColorStop(.4,"#422516");g.addColorStop(1,"#1b100a");ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(0,-26,p.w,52,24);ctx.fill();ctx.strokeStyle="#211109";ctx.lineWidth=3;for(let j=0;j<4;j++){ctx.beginPath();ctx.moveTo(25,j*9-14);ctx.bezierCurveTo(100,j*9-22,210,j*9+8,p.w-25,j*9-10);ctx.stroke()}ctx.restore()}}
function flame(x,base,w,h,seed,layer){const flick=1+.1*Math.sin(time*4+seed)+.045*Math.sin(time*9+seed*1.8),height=h*flick,width=w*(1+.06*Math.sin(time*5+seed)),sway=Math.sin(time*2.2+seed)*w*.15;ctx.save();ctx.translate(sway,0);ctx.globalAlpha=layer===0?.5:layer===1?.78:1;ctx.shadowColor="#ff681d";ctx.shadowBlur=layer===2?26:17;const g=ctx.createLinearGradient(x,base-height,x,base);g.addColorStop(0,"rgba(255,205,105,0)");g.addColorStop(.24,"rgba(255,166,48,.72)");g.addColorStop(.68,"rgba(245,78,17,.94)");g.addColorStop(1,"rgba(255,222,140,.95)");ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(x-width/2,base);ctx.bezierCurveTo(x-width*.72,base-height*.28,x-width*.14,base-height*.62,x+width*.04,base-height);ctx.bezierCurveTo(x+width*.02,base-height*.65,x+width*.82,base-height*.42,x+width/2,base);ctx.closePath();ctx.fill();if(layer===2){ctx.fillStyle="rgba(255,229,158,.65)";ctx.beginPath();ctx.moveTo(x-width*.18,base);ctx.quadraticCurveTo(x+width*.05,base-height*.42,x+width*.08,base-height*.65);ctx.quadraticCurveTo(x+width*.35,base-height*.3,x+width*.2,base);ctx.fill()}ctx.restore()}
function fire(){const glow=ctx.createRadialGradient(1020,780,10,1020,735,370);glow.addColorStop(0,"rgba(255,155,55,.34)");glow.addColorStop(1,"rgba(255,80,15,0)");ctx.fillStyle=glow;ctx.fillRect(790,390,440,480);for(let i=0;i<11;i++)flame(835+i*37+Math.sin(time*2+i)*8,830,62,205+Math.sin(time*2.8+i)*28,i,0);for(let i=0;i<9;i++)flame(860+i*43+Math.sin(time*2.5+i)*10,835,67,280+Math.sin(time*3+i)*35,i+20,1);for(let i=0;i<5;i++)flame(910+i*54+Math.sin(time*3+i)*8,835,55,245+Math.sin(time*3.5+i)*35,i+40,2);logs()}
function particles(){if(Math.random()<.36)sparks.push({x:rand(850,1190),y:rand(770,830),vx:rand(-1,1),vy:rand(-3.5,-1),life:rand(25,75),r:rand(1,3)});for(const s of sparks){s.x+=s.vx;s.y+=s.vy;s.life--;ctx.globalAlpha=clamp(s.life/75,0,1);ctx.fillStyle="#ffc46d";ctx.shadowColor="#ff8a32";ctx.shadowBlur=12;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.shadowBlur=0;sparks=sparks.filter(s=>s.life>0&&s.y>360)}
function draw(){time+=1/60;room();tree();fire();particles();const warm=ctx.createRadialGradient(1000,750,40,1000,650,850);warm.addColorStop(0,"rgba(255,137,52,.08)");warm.addColorStop(1,"rgba(0,0,0,.22)");ctx.fillStyle=warm;ctx.fillRect(0,0,W,H);for(const s of snow){s.y+=s.speed;s.x+=s.drift;if(s.y>H){s.y=-5;s.x=rand(0,W)}if(s.x<0)s.x=W;if(s.x>W)s.x=0;ctx.fillStyle="rgba(245,247,245,.58)";ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}requestAnimationFrame(draw)}
draw();
function startAudio(){if(audioContext){audioContext.resume();return}audioContext=new AudioContext();audioDestination=audioContext.createMediaStreamDestination();const buffer=audioContext.createBuffer(1,audioContext.sampleRate*3,audioContext.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*.1;const noise=audioContext.createBufferSource();noise.buffer=buffer;noise.loop=true;const filter=audioContext.createBiquadFilter();filter.type="lowpass";filter.frequency.value=650;const gain=audioContext.createGain();gain.gain.value=.35;noise.connect(filter);filter.connect(gain);gain.connect(audioDestination);gain.connect(audioContext.destination);noise.start();function crackle(){if(!audioContext||audioContext.state!=="running")return;const osc=audioContext.createOscillator(),g=audioContext.createGain();osc.type="triangle";osc.frequency.value=rand(500,1900);g.gain.setValueAtTime(.0001,audioContext.currentTime);g.gain.exponentialRampToValueAtTime(rand(.009,.025),audioContext.currentTime+.008);g.gain.exponentialRampToValueAtTime(.0001,audioContext.currentTime+.08);osc.connect(g);g.connect(audioDestination);g.connect(audioContext.destination);osc.start();osc.stop(audioContext.currentTime+.085);setTimeout(crackle,rand(220,900))}crackle();document.getElementById("audio").textContent="Fireplace audio enabled"}
document.getElementById("audio").addEventListener("click",()=>{startAudio();audioContext.resume()});
document.getElementById("fullscreen").addEventListener("click",async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){}});
function status(s){document.getElementById("status").textContent=s}
async function record(){if(recording)return;if(!window.MediaRecorder||!canvas.captureStream){status("Video recording is not supported in this browser.");return}recording=true;const button=document.getElementById("download");button.disabled=true;status("Preparing your Christmas clip…");if(!audioContext)startAudio();await audioContext.resume();const stream=canvas.captureStream(30),track=audioDestination.stream.getAudioTracks()[0];if(track)stream.addTrack(track);let mime="video/webm;codecs=vp9,opus";if(!MediaRecorder.isTypeSupported(mime))mime="video/webm;codecs=vp8,opus";if(!MediaRecorder.isTypeSupported(mime))mime="video/webm";const chunks=[],recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:8000000,audioBitsPerSecond:128000});recorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};recorder.onerror=()=>{status("Recording failed. Please try again.");recording=false;button.disabled=false;stream.getTracks().forEach(x=>x.stop())};recorder.onstop=()=>{const blob=new Blob(chunks,{type:mime}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="christmas-fireplace-25-seconds.webm";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);stream.getTracks().forEach(x=>x.stop());status("Christmas clip downloaded");recording=false;button.disabled=false};recorder.start(250);let remaining=25;status("Recording Christmas clip: 25 seconds");const timer=setInterval(()=>{remaining--;status("Recording: "+remaining+" seconds remaining");if(remaining<=0){clearInterval(timer);recorder.stop()}},1000)}
document.getElementById("download").addEventListener("click",record);
document.addEventListener("keydown",e=>{if(e.repeat||e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key.toLowerCase();if(k==="d"&&!["INPUT","TEXTAREA"].includes(document.activeElement.tagName)){e.preventDefault();record()}if(k==="f"){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}if(k==="h")document.body.classList.toggle("controls-visible")});
})();
</script>
</body></html>

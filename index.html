<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#100b1c">
<title>Halloween Night — Livestream Background</title>
<style>
:root{color-scheme:dark;--orange:#ff8a27;--gold:#ffc46b;--purple:#9b62d9}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090711;font-family:Georgia,'Times New Roman',serif}
.scene{position:relative;width:100%;height:100%;min-height:100svh;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse at 50% 72%,#4b2146 0,#21142f 35%,#100e22 68%,#070912 100%)}
.sky{position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,8,19,.25),transparent 48%,rgba(7,5,13,.2));}
.moon{position:absolute;width:clamp(100px,16vw,230px);aspect-ratio:1;right:15%;top:10%;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff4d8,#e6cba6 55%,#a78a80 100%);box-shadow:0 0 45px 12px #f4c58b55,0 0 130px 45px #c58be733}
.moon:after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 25% 62%,#9b8b8250 0 7%,transparent 8%),radial-gradient(circle at 65% 30%,#8b7b7640 0 5%,transparent 6%),radial-gradient(circle at 70% 70%,#8b7b7640 0 9%,transparent 10%)}
.stars{position:absolute;inset:0;background-image:radial-gradient(2px 2px at 12% 18%,#fff 50%,transparent 55%),radial-gradient(1px 1px at 30% 13%,#fff 50%,transparent 55%),radial-gradient(2px 2px at 54% 22%,#ffe8bd 50%,transparent 55%),radial-gradient(1px 1px at 77% 14%,#fff 50%,transparent 55%),radial-gradient(1px 1px at 88% 38%,#fff 50%,transparent 55%),radial-gradient(2px 2px at 42% 39%,#fff 50%,transparent 55%),radial-gradient(1px 1px at 7% 45%,#fff 50%,transparent 55%);opacity:.75}
.cloud{position:absolute;width:42vw;height:13vw;min-height:100px;top:29%;left:-10%;border-radius:50%;background:#171426;filter:blur(28px);opacity:.62;animation:cloud 48s linear infinite}
.cloud.c2{top:42%;left:58%;width:50vw;opacity:.42;animation-duration:65s;animation-direction:reverse}
@keyframes cloud{from{transform:translateX(-12vw)}to{transform:translateX(120vw)}}
.title-wrap{position:absolute;z-index:5;top:24%;left:50%;width:90%;transform:translateX(-50%);text-align:center}
.eyebrow{font:600 clamp(10px,1.2vw,17px)/1.5 Arial,sans-serif;letter-spacing:.55em;text-transform:uppercase;color:#f6bd78;text-shadow:0 0 15px #f80}
h1{margin:.08em 0 .02em;font-size:clamp(42px,8.4vw,122px);line-height:.95;font-weight:700;letter-spacing:.035em;color:#fff0d8;text-shadow:0 4px 0 #8c3b23,0 8px 24px #000,0 0 35px #ff8a2777}
.subtitle{font:italic clamp(13px,1.6vw,23px)/1.5 Georgia,serif;color:#f4c9a0;letter-spacing:.12em;text-shadow:0 2px 9px #000}
.hills{position:absolute;z-index:2;bottom:0;left:0;width:100%;height:36%;background:linear-gradient(180deg,#17101e,#090a12 72%)}
.hill-back{position:absolute;z-index:1;bottom:17%;left:-8%;width:116%;height:22%;border-radius:50% 50% 0 0;background:#1b1424;transform:rotate(-2deg)}
.house{position:absolute;z-index:3;bottom:19%;left:50%;width:clamp(160px,24vw,350px);height:clamp(130px,19vw,260px);transform:translateX(-50%);background:#0b0b14;clip-path:polygon(50% 0,100% 36%,91% 36%,91% 100%,8% 100%,8% 36%,0 36%)}
.house:before{content:"";position:absolute;left:25%;top:42%;width:18%;height:28%;background:#ffb64e;box-shadow:0 0 20px #ff8c22}
.house:after{content:"";position:absolute;right:25%;top:42%;width:18%;height:28%;background:#ffb64e;box-shadow:0 0 20px #ff8c22}
.door{position:absolute;z-index:4;bottom:19%;left:50%;transform:translateX(-50%);width:clamp(34px,5vw,68px);height:clamp(72px,10vw,135px);background:#090810;border:2px solid #3b2531;border-bottom:0;border-radius:50% 50% 0 0}
.tree{position:absolute;z-index:4;bottom:17%;width:clamp(100px,15vw,210px);height:43%;background:#080a11;clip-path:polygon(50% 0,43% 23%,31% 17%,35% 35%,18% 31%,27% 50%,5% 47%,25% 65%,19% 78%,43% 74%,45% 100%,57% 100%,58% 74%,82% 80%,75% 63%,97% 49%,74% 50%,84% 31%,65% 36%,68% 17%,55% 24%)}
.tree.left{left:4%;transform:scale(1.12)}.tree.right{right:3%;transform:scale(1.35)}
.grave{position:absolute;z-index:3;bottom:12%;width:clamp(25px,4vw,58px);height:clamp(38px,6vw,82px);background:#11131a;border-radius:50% 50% 4px 4px;border:2px solid #252333}
.grave.g1{left:25%;transform:rotate(-7deg)}.grave.g2{right:23%;transform:rotate(8deg) scale(.8)}
.pumpkin{position:absolute;z-index:6;bottom:7%;width:clamp(46px,7vw,100px);aspect-ratio:1.15;border-radius:48% 48% 42% 42%;background:radial-gradient(ellipse at 50% 50%,#ffb13e 0,#f47b18 60%,#8f3513 100%);box-shadow:inset 9px 0 0 #9e461c55,inset -9px 0 0 #7e341d55,0 0 24px #ff8b2b77}
.pumpkin:before{content:"";position:absolute;left:46%;top:-10%;width:10%;height:18%;background:#4a6a36;transform:rotate(9deg);border-radius:4px}
.face{position:absolute;inset:0;background:linear-gradient(70deg,transparent 31%,#3b1b13 32% 40%,transparent 41%),linear-gradient(-70deg,transparent 31%,#3b1b13 32% 40%,transparent 41%);clip-path:polygon(20% 32%,40% 44%,50% 29%,60% 44%,80% 32%,72% 62%,50% 82%,28% 62%);opacity:.9}
.p1{left:12%}.p2{right:12%;transform:scale(.8)}
.fog{position:absolute;z-index:7;bottom:0;left:-30%;width:160%;height:20%;background:linear-gradient(180deg,transparent,#c8b4d01b 60%,#d8c5df12);filter:blur(18px);animation:fog 18s ease-in-out infinite alternate}
@keyframes fog{from{transform:translateX(-4%);opacity:.55}to{transform:translateX(4%);opacity:1}}
.bat{position:absolute;z-index:4;color:#080811;font-size:clamp(22px,3vw,40px);animation:fly 16s linear infinite}
.b1{top:22%;left:-8%;animation-delay:-3s}.b2{top:35%;left:-8%;font-size:24px;animation-delay:-10s}.b3{top:15%;left:-8%;font-size:18px;animation-delay:-6s}
@keyframes fly{from{transform:translateX(-10vw) translateY(0) rotate(-8deg)}50%{transform:translateX(55vw) translateY(-28px) rotate(8deg)}to{transform:translateX(120vw) translateY(8px) rotate(-8deg)}}
.grain{position:absolute;inset:0;z-index:8;pointer-events:none;opacity:.12;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.24'/%3E%3C/svg%3E")}
.toolbar{position:absolute;z-index:20;left:18px;bottom:16px;display:flex;gap:9px;align-items:center;padding:10px 12px;border:1px solid #ffffff26;border-radius:14px;background:#100b1dcc;backdrop-filter:blur(12px);font:12px Arial,sans-serif;color:#f6e7d3;transition:opacity .25s}
.toolbar button,.toolbar a{border:1px solid #ffffff30;border-radius:9px;padding:9px 12px;background:#ffffff12;color:#fff;text-decoration:none;font:600 12px Arial,sans-serif;cursor:pointer}
.toolbar button:hover,.toolbar a:hover{background:#ff8a2733;border-color:#ffb36b}
.hint{opacity:.72;font-size:11px;margin-left:4px}
body.clean .toolbar{opacity:0;pointer-events:none}
@media(max-width:600px){.title-wrap{top:30%}.moon{right:8%;top:9%}.tree.left{left:-3%}.tree.right{right:-5%}.toolbar{left:8px;bottom:8px;gap:5px;padding:7px}.toolbar button,.toolbar a{padding:8px;font-size:10px}.hint{display:none}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="scene" aria-label="Animated Halloween night livestream background">
<div class="sky"></div><div class="stars"></div><div class="moon"></div><div class="cloud"></div><div class="cloud c2"></div>
<div class="title-wrap"><div class="eyebrow">A night of spooky magic</div><h1>HAPPY<br>HALLOWEEN</h1><div class="subtitle">Welcome, if you dare...</div></div>
<div class="bat b1">🦇</div><div class="bat b2">🦇</div><div class="bat b3">🦇</div>
<div class="hill-back"></div><div class="tree left"></div><div class="tree right"></div><div class="house"></div><div class="door"></div><div class="grave g1"></div><div class="grave g2"></div>
<div class="hills"></div><div class="pumpkin p1"><div class="face"></div></div><div class="pumpkin p2"><div class="face"></div></div><div class="fog"></div><div class="grain"></div>
<div class="toolbar" id="toolbar"><button id="clean">Stream mode</button><button id="full">Fullscreen</button><a href="https://open.spotify.com/playlist/37i9dQZF1DWYa1w6FMMTnG?si=93f27fc6c3c54547" target="_blank" rel="noopener noreferrer">Spotify playlist ↗</a><span class="hint">Use licensed music in OBS / YouTube Studio</span></div>
</main>
<script>
const cleanButton=document.getElementById('clean');
cleanButton.addEventListener('click',()=>{document.body.classList.toggle('clean');cleanButton.textContent=document.body.classList.contains('clean')?'Show controls':'Stream mode'});
document.getElementById('full').addEventListener('click',async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){}});
document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='h'){document.body.classList.toggle('clean');cleanButton.textContent=document.body.classList.contains('clean')?'Show controls':'Stream mode'}});
</script>
</body>
</html>
